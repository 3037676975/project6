name: Sync Animation Upstreams

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-animation-upstreams.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gsap /tmp/emil-skills
          git clone --depth 1 https://github.com/greensock/GSAP.git /tmp/gsap
          git clone --depth 1 https://github.com/emilkowalski/skills.git /tmp/emil-skills

          GSAP_SHA=$(git -C /tmp/gsap rev-parse HEAD)
          EMIL_SHA=$(git -C /tmp/emil-skills rev-parse HEAD)

          rm -rf vendor/upstream/gsap vendor/upstream/emil-skills
          mkdir -p vendor/upstream/gsap vendor/upstream/emil-skills
          cp -a /tmp/gsap/. vendor/upstream/gsap/
          cp -a /tmp/emil-skills/. vendor/upstream/emil-skills/
          rm -rf vendor/upstream/gsap/.git vendor/upstream/emil-skills/.git

          {
            echo '# Animation upstream snapshot'
            echo
            echo 'Generated by .github/workflows/sync-animation-upstreams.yml.'
            echo
            echo '- GSAP: https://github.com/greensock/GSAP'
            echo "  - commit: ${GSAP_SHA}"
            echo '  - license: GreenSock Standard "no charge" license (see upstream README/package metadata)'
            echo '- Emil Kowalski Skills: https://github.com/emilkowalski/skills'
            echo "  - commit: ${EMIL_SHA}"
            echo '  - license: MIT (license file preserved in mirror)'
            echo
            echo 'The directories below are upstream mirrors. Project6-specific wrappers and Chinese documentation live outside these directories so upstream files remain identifiable.'
          } > vendor/upstream/UPSTREAM_SNAPSHOT.md

      - name: Commit vendored snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/upstream
          if git diff --cached --quiet; then
            echo "No upstream changes to commit"
            exit 0
          fi
          git commit -m "vendor: mirror GSAP and Emil animation skills"
          git push
