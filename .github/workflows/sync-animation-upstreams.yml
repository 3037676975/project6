name: Sync Creative Upstreams

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-animation-upstreams.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project6
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream repositories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gsap /tmp/emil-skills /tmp/uiverse-galaxy
          git clone --depth 1 https://github.com/greensock/GSAP.git /tmp/gsap
          git clone --depth 1 https://github.com/emilkowalski/skills.git /tmp/emil-skills
          git clone --depth 1 https://github.com/uiverse-io/galaxy.git /tmp/uiverse-galaxy

          GSAP_SHA=$(git -C /tmp/gsap rev-parse HEAD)
          EMIL_SHA=$(git -C /tmp/emil-skills rev-parse HEAD)
          GALAXY_SHA=$(git -C /tmp/uiverse-galaxy rev-parse HEAD)

          rm -rf vendor/upstream/gsap vendor/upstream/emil-skills vendor/upstream/uiverse-galaxy
          mkdir -p vendor/upstream/gsap vendor/upstream/emil-skills vendor/upstream/uiverse-galaxy data
          cp -a /tmp/gsap/. vendor/upstream/gsap/
          cp -a /tmp/emil-skills/. vendor/upstream/emil-skills/
          cp -a /tmp/uiverse-galaxy/. vendor/upstream/uiverse-galaxy/
          rm -rf vendor/upstream/gsap/.git vendor/upstream/emil-skills/.git vendor/upstream/uiverse-galaxy/.git

          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('vendor/upstream/uiverse-galaxy')
          items=[]
          categories={}
          for p in sorted(root.rglob('*.html')):
              rel=p.relative_to(root).as_posix()
              if '/' not in rel:
                  continue
              category=rel.split('/',1)[0]
              name=p.stem
              author, slug=(name.split('_',1)+[''])[:2] if '_' in name else ('community',name)
              item={
                  'id': rel,
                  'category': category,
                  'name': name,
                  'author': author,
                  'slug': slug,
                  'path': './vendor/upstream/uiverse-galaxy/'+rel,
              }
              items.append(item)
              categories[category]=categories.get(category,0)+1
          payload={
              'source':'uiverse-io/galaxy',
              'license':'MIT',
              'total':len(items),
              'categories':dict(sorted(categories.items())),
              'items':items,
          }
          Path('data/galaxy-components.json').write_text(json.dumps(payload,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('Galaxy components indexed:',len(items))
          PY

          {
            echo '# Creative upstream snapshot'
            echo
            echo 'Generated by .github/workflows/sync-animation-upstreams.yml.'
            echo
            echo '- GSAP: https://github.com/greensock/GSAP'
            echo "  - commit: ${GSAP_SHA}"
            echo '  - license: GreenSock Standard "no charge" license (see upstream README/package metadata)'
            echo '- Emil Kowalski Skills: https://github.com/emilkowalski/skills'
            echo "  - commit: ${EMIL_SHA}"
            echo '  - license: MIT (license file preserved in mirror)'
            echo '- Uiverse Galaxy: https://github.com/uiverse-io/galaxy'
            echo "  - commit: ${GALAXY_SHA}"
            echo '  - license: MIT (license file preserved in mirror)'
            echo
            echo 'The directories below are upstream mirrors. Project6-specific wrappers, indexes and Chinese documentation live outside these directories so upstream files remain identifiable.'
          } > vendor/upstream/UPSTREAM_SNAPSHOT.md

      - name: Commit vendored snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/upstream data/galaxy-components.json
          if git diff --cached --quiet; then
            echo "No upstream changes to commit"
            exit 0
          fi
          git commit -m "vendor: mirror GSAP, Emil Skills and Uiverse Galaxy"
          git push
