name: Apply Harness Chapter1 v13 Palette Motion

on:
  push:
    paths:
      - "scripts/apply-chapter1-v13-palette-motion.mjs"
      - ".github/workflows/apply-chapter1-v13-palette-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply v13 palette and motion
        run: node scripts/apply-chapter1-v13-palette-motion.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/harness-engineering/index.html presentations/harness-engineering/chapter1-redesign.css presentations/harness-engineering/chapter1-redesign.js
          git diff --cached --quiet || git commit -m "style: rebuild chapter1 palette and semantic motion v13"
          git push
