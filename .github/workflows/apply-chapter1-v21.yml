name: Apply Harness Chapter1 v21
on:
  push:
    paths:
      - 'scripts/apply-chapter1-v21.mjs'
      - '.github/workflows/apply-chapter1-v21.yml'
      - 'presentations/harness-engineering/chapter1-v21-controls.css'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-chapter1-v21.mjs
      - name: Commit v21
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentations/harness-engineering/index.html
          git commit -m 'fix: remove recorder and refine playback music dock'
          git push
