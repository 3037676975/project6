name: Validate Harness Chapter 1

on:
  workflow_dispatch:
  push:
    paths:
      - "presentations/harness-engineering/index.html"
      - "presentations/harness-engineering/chapter1-redesign.css"
      - "presentations/harness-engineering/chapter1-redesign.js"
      - "presentations/harness-engineering/audio-map.json"
      - "presentations/harness-engineering/timings.json"
      - "presentations/harness-engineering/ACCEPTANCE.md"
      - "presentations/harness-engineering/ANIMATION_REVIEW.md"
      - "presentations/harness-engineering/public/audio/**"
      - "presentations/harness-engineering/public/timing/**"
      - "vendor/upstream/gsap/**"
      - "vendor/upstream/emil-skills/**"
      - "vendor/upstream/uiverse-galaxy/**"
      - "data/galaxy-components.json"
      - "data/galaxy-curated.json"
      - "scripts/validate-harness-chapter1.mjs"
      - ".github/workflows/validate-harness-chapter1.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Harness chapter 1 gate
        run: node scripts/validate-harness-chapter1.mjs
