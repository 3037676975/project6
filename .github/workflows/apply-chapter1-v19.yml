name: Apply Harness Chapter1 v19
on:
  push:
    paths:
      - 'scripts/apply-chapter1-v19.mjs'
      - 'presentations/harness-engineering/chapter1-v19-runtime.js'
      - 'presentations/harness-engineering/chapter1-v17-recovery.css'
      - 'presentations/harness-engineering/design-system.html'
      - '.github/workflows/apply-chapter1-v19.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Vendor html2canvas
        run: |
          npm install --no-save html2canvas@1.4.1
          mkdir -p vendor/html2canvas
          cp node_modules/html2canvas/dist/html2canvas.min.js vendor/html2canvas/html2canvas.min.js
      - name: Apply v19
        run: node scripts/apply-chapter1-v19.mjs
      - name: Commit generated changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add presentations/harness-engineering/index.html presentations/harness-engineering/chapter1-redesign.js vendor/html2canvas/html2canvas.min.js
          git diff --cached --quiet || git commit -m 'fix: apply chapter1 v19 design and http recording runtime'
          git push