name: Normalize Project6 Static HTML

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/normalize-harness-html.py"
      - ".github/workflows/normalize-harness-html.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize authored static markup
        run: python scripts/normalize-harness-html.py
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/harness-engineering/index.html motions.html
          if git diff --cached --quiet; then
            echo "No normalization changes"
          else
            git commit -m "fix: normalize Project6 static markup [skip ci]"
            git push
          fi
