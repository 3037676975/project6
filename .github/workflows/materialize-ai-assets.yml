name: Materialize AI PNG assets
on:
  push:
    paths:
      - 'tools/ai-assets-pack.zip'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract AI assets
        run: |
          rm -rf assets/ip/ai-generated
          mkdir -p assets/ip/ai-generated
          unzip -o tools/ai-assets-pack.zip -d assets/ip/ai-generated
          find assets/ip/ai-generated -type f -name '*.png' | sort
          test "$(find assets/ip/ai-generated -type f -name '*.png' | wc -l)" -eq 17
      - name: Commit extracted PNGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ip/ai-generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ip): add 17 generated AI PNG assets'
          git push
