name: Materialize AI PNG assets
on:
  push:
    paths:
      - 'tools/generate_ai_icons.py'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate transparent PNG assets and register them
        run: |
          python -m pip install pillow
          python tools/generate_ai_icons.py
          test "$(find assets/ip/ai-generated -type f -name '*.png' | wc -l)" -eq 16
      - name: Commit generated PNGs and IP page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ip/ai-generated ip.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ip): publish AI logo and tool PNG categories'
          git push
