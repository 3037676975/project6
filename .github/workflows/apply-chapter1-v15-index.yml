name: Apply Harness Chapter1 v15 Loader
on:
  push:
    branches: [main]
    paths:
      - 'presentations/harness-engineering/chapter1-v15-materials.css'
      - 'scripts/apply-chapter1-v15-index.mjs'
      - '.github/workflows/apply-chapter1-v15-index.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/apply-chapter1-v15-index.mjs
      - name: Commit loader update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentations/harness-engineering/index.html
          git commit -m 'style: load chapter1 v15 material layer'
          git push
