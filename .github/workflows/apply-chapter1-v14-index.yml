name: Apply Harness Chapter1 v14 Loader
on:
  push:
    paths:
      - "scripts/apply-chapter1-v14-index.mjs"
      - ".github/workflows/apply-chapter1-v14-index.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply v14 loader
        run: node scripts/apply-chapter1-v14-index.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/harness-engineering/index.html
          git diff --cached --quiet || git commit -m "style: load chapter1 v14 polish layer"
          git push
