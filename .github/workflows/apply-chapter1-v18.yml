name: Apply Harness Chapter1 v18
on:
  push:
    paths:
      - 'scripts/apply-chapter1-v18.mjs'
      - 'presentations/harness-engineering/chapter1-v17-recovery.css'
      - 'presentations/harness-engineering/chapter1-v18-recording.js'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-chapter1-v18.mjs
      - name: Commit v18 loader
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/harness-engineering/index.html
          git commit -m "build: load chapter1 v18 summary and recording hint"
          git push
