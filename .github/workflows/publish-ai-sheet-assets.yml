name: Publish AI Sheet Assets
on:
  push:
    paths:
      - 'tools/ip-publish/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild archive
        run: |
          cat tools/ip-publish/part-* > /tmp/assets.b64
          base64 -d /tmp/assets.b64 > /tmp/assets.zip
          rm -rf assets/ip/ai-sheet-real
          mkdir -p assets/ip/ai-sheet-real
          unzip -q /tmp/assets.zip -d assets/ip/ai-sheet-real
          test "$(find assets/ip/ai-sheet-real -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 38
      - name: Commit 38 PNG assets
        run: |
          rm -rf tools/ip-publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ip): publish 38 real AI sheet cut PNG assets'
          git push
