name: Publish IP PNG Assets

on:
  push:
    paths:
      - 'tools/ip-upload/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild upload package
        run: |
          mkdir -p /tmp/ipupload
          cat tools/ip-upload/chunk-*.txt > /tmp/ipupload/assets.b64
          base64 -d /tmp/ipupload/assets.b64 > /tmp/ipupload/assets.zip
      - name: Extract PNG assets
        run: |
          rm -rf assets/ip/xiaohieyun
          mkdir -p assets/ip/xiaohieyun/{host,machine,prop,metaphor,card}
          unzip -q /tmp/ipupload/assets.zip -d /tmp/ipupload/png
          cp /tmp/ipupload/png/host-*.png assets/ip/xiaohieyun/host/
          cp /tmp/ipupload/png/machine-*.png assets/ip/xiaohieyun/machine/
          cp /tmp/ipupload/png/prop-*.png assets/ip/xiaohieyun/prop/
          cp /tmp/ipupload/png/metaphor-*.png assets/ip/xiaohieyun/metaphor/
          cp /tmp/ipupload/png/card-*.png assets/ip/xiaohieyun/card/
      - name: Commit direct PNG files
        run: |
          rm -rf tools/ip-upload
          git config user.name 'project6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/ip/xiaohieyun tools/ip-upload
          git commit -m 'fix(ip): publish direct PNG assets' || exit 0
          git push
