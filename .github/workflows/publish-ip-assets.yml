name: Publish IP PNG Assets

on:
  push:
    paths:
      - 'tools/ip-upload/AIGC小黑云-IP资产库-v1.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract direct PNG assets
        run: |
          set -e
          ZIP='tools/ip-upload/AIGC小黑云-IP资产库-v1.zip'
          TMP='/tmp/project6-ip-assets'
          rm -rf "$TMP" assets/ip/xiaohieyun
          mkdir -p "$TMP" assets/ip/xiaohieyun/{host,machine,prop,metaphor,card}
          unzip -q "$ZIP" -d "$TMP"
          cp "$TMP"/host-*.png assets/ip/xiaohieyun/host/
          cp "$TMP"/machine-*.png assets/ip/xiaohieyun/machine/
          cp "$TMP"/prop-*.png assets/ip/xiaohieyun/prop/
          cp "$TMP"/metaphor-*.png assets/ip/xiaohieyun/metaphor/
          cp "$TMP"/card-*.png assets/ip/xiaohieyun/card/
          COUNT=$(find assets/ip/xiaohieyun -type f -name '*.png' | wc -l)
          echo "Published PNG count: $COUNT"
          test "$COUNT" -eq 48
      - name: Commit direct PNG files
        run: |
          git config user.name 'project6-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/ip/xiaohieyun
          git commit -m 'fix(ip): publish 48 direct PNG assets' || exit 0
          git push
