<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音效库 · Project6</title><style>:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68758c;--line:#e5e9f1;--blue:#2563eb;--teal:#0f9687}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:34px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top h1{margin:0;font-size:30px}.top p{color:var(--muted);margin:7px 0 0}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.tabs{display:flex;gap:8px;margin:24px 0}.tab{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:800;font-size:13px}.tab.on{background:#eef4ff;color:var(--blue);border-color:#d6e2ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.sound{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px}.sound b{display:block}.sound small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}.badge{font-size:11px;font-weight:900;color:var(--teal);background:#e9f8f4;border-radius:999px;padding:6px 9px;height:max-content}.note{margin-top:20px;padding:16px 18px;border-radius:16px;background:#eef4ff;color:#4d5c79;line-height:1.7}.upload{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.upload input{margin-top:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>音效库</h1><p>统一管理 Project6 视频作品使用的 BGM、转场和提示音。</p></div><a class="btn" href="./index.html">← 返回后台</a></div><div class="tabs"><span class="tab on">全部</span><span class="tab">BGM</span><span class="tab">转场</span><span class="tab">提示音</span></div><section class="grid"><article class="sound"><div><b>轻松科技</b><small>知识讲解 / AI / 产品说明 · 已用于第一章预置</small></div><span class="badge">BGM</span></article><article class="sound"><div><b>轻松氛围</b><small>慢节奏解释、总结和过渡画面</small></div><span class="badge">BGM</span></article><article class="sound"><div><b>轻快神秘</b><small>问题引入、悬念和转折</small></div><span class="badge">BGM</span></article><article class="sound"><div><b>本地自定义</b><small>以后可为单个作品上传自己的 BGM / SFX，不与 TTS 混在一起。</small></div><span class="badge">LOCAL</span></article></section><section class="upload"><b>临时试听本地音效</b><div style="color:var(--muted);font-size:13px;margin-top:6px">第一版先做浏览器本地试听，不上传服务器。最终选择会在具体视频作品内确认。</div><input id="audio" type="file" accept="audio/*"><div style="margin-top:12px"><audio id="player" controls style="width:100%"></audio></div></section><div class="note"><b>新的 Project6 原则：</b>音效库只负责资源管理；脚本、画面、配音和合成都放在「视频作品 → 具体项目」内部，不再存在独立“视频工作台”。</div></main><script>let u=null;document.getElementById('audio').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(u)URL.revokeObjectURL(u);u=URL.createObjectURL(f);const p=document.getElementById('player');p.src=u;p.play().catch(()=>{})});</script></body></html>
