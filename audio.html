<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画音效库 · Project6</title><style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#68758c;--line:#e5e9f1;--blue:#2563eb;--teal:#0f9687;--soft:#eef4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:34px 24px 72px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center}.top h1{margin:0;font-size:31px}.top p{margin:7px 0 0;color:var(--muted);line-height:1.65}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:800;text-decoration:none;cursor:pointer}.hero{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px}.hero strong{font-size:20px}.hero small{display:block;color:var(--muted);margin-top:6px;line-height:1.6}.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:#e9f8f4;color:#087b70;font-size:11px;font-weight:900}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.source{background:#fff;border:1px solid var(--line);border-radius:17px;padding:16px}.source b{display:block}.source small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.source a{display:inline-block;margin-top:10px;color:var(--blue);font-weight:800;font-size:13px;text-decoration:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px}.filter{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:999px;font-weight:800;color:#536079;cursor:pointer}.filter.on{background:var(--soft);color:var(--blue);border-color:#d5e1ff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.sound{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.head{display:flex;justify-content:space-between;gap:12px}.head b{font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.desc{color:#536079;font-size:13px;line-height:1.55;margin:12px 0}.sound audio{width:100%}.license{margin-top:10px;font-size:12px;color:var(--muted)}.note{margin-top:20px;padding:17px 18px;border-radius:16px;background:var(--soft);color:#4b5b78;line-height:1.7}.error{padding:18px;border:1px solid #f1d6d6;background:#fff8f8;border-radius:16px;color:#9b4141}.local{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.local audio{width:100%;margin-top:12px}@media(max-width:820px){.sources,.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div><h1>动画音效库</h1><p>这里只管理画面动作的短 SFX，不是人物配音。配音永远放在具体视频项目内部。</p></div><a class="btn" href="./index.html">← 返回后台</a></div>
<section class="hero"><div><strong>真实资源：Kenney CC0 音效</strong><small>第一批使用 Kenney UI Audio / Interface Sounds。这里直接提供真实可试听声音，并显示来源与许可证。</small></div><span class="badge">REAL SFX · CC0</span></section>
<section class="sources" id="sources"></section><div class="toolbar" id="filters"></div><section class="grid" id="grid"><div class="note">正在读取真实音效目录…</div></section>
<section class="local"><b>临时试听你自己的动画音效</b><div class="meta">只在浏览器本地试听，不上传服务器。</div><input id="localFile" type="file" accept="audio/*"><audio id="localPlayer" controls></audio></section>
<div class="note"><b>使用顺序：</b>脚本确认 → Garden 画面确认 → 本地 IndexTTS 配音 → 本地音画预览通过 → <b>最后</b>才从这里给元素出现、转场、点击和关键强调选择 SFX。</div></main>
<script>
const $=s=>document.querySelector(s);let items=[],active='全部',localUrl=null;
function render(){const cats=['全部',...new Set(items.map(x=>x.category))];$('#filters').innerHTML=cats.map(c=>`<button class="filter ${c===active?'on':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.c;render()}));const list=active==='全部'?items:items.filter(x=>x.category===active);$('#grid').innerHTML=list.map(x=>`<article class="sound"><div class="head"><div><b>${x.name}</b><div class="meta">${x.category} · ${x.source}</div></div><span class="badge">${x.license}</span></div><div class="desc">推荐：${x.recommended_for}</div><audio controls preload="none" src="${x.src}"></audio><div class="license">真实来源：${x.source}</div></article>`).join('')||'<div class="note">这个分类暂时没有资源。</div>'}
fetch('./data/sfx-library.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{items=data.items||[];$('#sources').innerHTML=(data.sources||[]).map(s=>`<article class="source"><b>${s.name}</b><small>${s.files} 个文件 · ${s.license}</small><a href="${s.homepage}" target="_blank" rel="noopener">查看真实来源 ↗</a></article>`).join('');render()}).catch(err=>{$('#grid').innerHTML=`<div class="error">音效目录读取失败：${err.message}</div>`});
$('#localFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);$('#localPlayer').src=localUrl;$('#localPlayer').play().catch(()=>{})});
</script></body></html>
