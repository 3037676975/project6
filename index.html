<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project6 · Server Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #eaf2ff;
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.24), transparent 34%),
        radial-gradient(circle at 80% 80%, rgba(139,92,246,.20), transparent 32%),
        #07111f;
    }
    .card {
      width: min(760px, 100%);
      padding: 44px;
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 28px;
      background: rgba(15,23,42,.72);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: #bfdbfe;
      background: rgba(37,99,235,.12);
      border: 1px solid rgba(96,165,250,.24);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34,197,94,.55);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      70% { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
    }
    h1 {
      margin: 24px 0 12px;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 span {
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 0;
      color: #94a3b8;
      font-size: 17px;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 30px;
    }
    .item {
      padding: 18px;
      border-radius: 18px;
      background: rgba(30,41,59,.62);
      border: 1px solid rgba(148,163,184,.12);
    }
    .item strong {
      display: block;
      margin-bottom: 6px;
      color: #f8fafc;
      font-size: 14px;
    }
    .item span { color: #7dd3fc; font-size: 13px; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    button, a {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    button {
      color: white;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
    }
    a {
      color: #cbd5e1;
      background: #1e293b;
    }
    #result {
      min-height: 24px;
      margin-top: 18px;
      font-size: 14px;
      color: #86efac;
    }
    footer {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid rgba(148,163,184,.12);
      color: #64748b;
      font-size: 12px;
    }
    @media (max-width: 640px) {
      .card { padding: 28px 22px; border-radius: 22px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> Project6 deployment test</div>
    <h1>Project6 <span>已接通</span></h1>
    <p>
      如果你能在服务器地址看到这个页面，说明 GitHub → 宝塔 → Web 站点的基础部署链路已经成功。
      下一步就可以在这里继续搭建 AI Video Studio 工作台。
    </p>

    <section class="grid">
      <div class="item"><strong>Repository</strong><span>3037676975/project6</span></div>
      <div class="item"><strong>Entry</strong><span>/index.html</span></div>
      <div class="item"><strong>Status</strong><span>READY</span></div>
    </section>

    <div class="actions">
      <button id="testBtn">测试页面 JavaScript</button>
      <a href="https://github.com/3037676975/project6" target="_blank" rel="noopener">打开 GitHub</a>
    </div>

    <div id="result"></div>

    <footer>Project6 · AI Video Studio · Static deployment test page</footer>
  </main>

  <script>
    document.getElementById('testBtn').addEventListener('click', function () {
      document.getElementById('result').textContent = '✓ JavaScript 正常运行 · ' + new Date().toLocaleString();
    });
  </script>
</body>
</html>
