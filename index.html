<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project6 AI Video Studio Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1100px;margin:auto;padding:50px 24px}.card{background:linear-gradient(135deg,#151d35,#202b4d);border:1px solid rgba(255,255,255,.12);border-radius:32px;padding:42px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.tag{display:inline-block;padding:8px 14px;border-radius:999px;background:#22c55e;color:#04120a;font-weight:800;font-size:13px}h1{font-size:64px;line-height:1;margin:25px 0}h1 span{color:#60a5fa}.desc{color:#cbd5e1;font-size:18px;line-height:1.8}.panel{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:35px}.item{background:rgba(255,255,255,.06);padding:22px;border-radius:20px}.item small{color:#94a3b8}.item b{display:block;margin-top:10px;font-size:20px}.btn{margin-top:30px;padding:14px 24px;border:0;border-radius:14px;background:#60a5fa;color:#07111f;font-weight:800;cursor:pointer}#msg{margin-top:20px;color:#4ade80}@media(max-width:700px){h1{font-size:42px}.panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<section class="card">
<div class="tag">PROJECT6 V3 DEPLOY TEST</div>
<h1>AI Video<br><span>Creative Studio</span></h1>
<p class="desc">这是 Project6 自动部署第三版测试页面。用于验证 GitHub → 宝塔 → 服务器链路是否正常。</p>
<div class="panel">
<div class="item"><small>PROJECT</small><b>AI Video Workbench</b></div>
<div class="item"><small>DEPLOY</small><b>Baota + GitHub</b></div>
<div class="item"><small>STATUS</small><b>Waiting Test</b></div>
</div>
<button class="btn" onclick="test()">运行页面测试</button>
<div id="msg"></div>
</section>
</div>
<script>function test(){document.getElementById('msg').innerHTML='✓ Project6 前端运行正常 '+new Date().toLocaleString('zh-CN')}</script>
</body>
</html>
