<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP 素材库 · Project6</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>:root{--ink:#101828;--muted:#667085;--line:#e4eaf2;--blue:#1677ff;--red:#f04438}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:var(--ink);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:190px 1fr}.side{background:#fff;border-right:1px solid var(--line);padding:24px 14px}.brand{font-size:18px;font-weight:900;margin-bottom:28px}.nav a{display:block;padding:11px 13px;border-radius:11px;color:#5d697a;text-decoration:none;font-size:13px;font-weight:700;margin:4px 0}.nav a.active{background:#eaf3ff;color:var(--blue)}.main{padding:26px 30px 60px}.hero,.dropzone{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.hero h1{margin:0;font-size:36px}.hero p{color:var(--muted);line-height:1.8}.stats,.pick,.cats,.catmanager{display:flex;gap:10px;flex-wrap:wrap}.stats{margin-top:16px}.stat{padding:10px 14px;border:1px solid var(--line);border-radius:12px}.stat b{display:block}.stat span{font-size:11px;color:var(--muted)}.dropzone{margin-top:18px;border:2px dashed #9bc3ff}.dropzone.drag{background:#f2f7ff;border-color:var(--blue)}.dropgrid{display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:center}.button{border:0;background:var(--blue);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.button.secondary{background:#f5f8fc;color:#344054;border:1px solid var(--line)}.button.danger{background:#fff1f0;color:#b42318;border:1px solid #ffd5d2}.select,.search,.newcat{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.dropstatus{display:none;margin-top:10px;padding:10px;border-radius:9px}.dropstatus.show{display:block}.dropstatus.ok{display:block;background:#ecfdf3;color:#067647}.dropstatus.warn{display:block;background:#fff8e8;color:#b54708}.dropstatus.err{display:block;background:#fff1f0;color:#b42318}.toolbar{margin:20px 0 14px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}.cat{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:10px;font-weight:700;cursor:pointer}.cat.on{background:var(--blue);color:#fff}.catmanager{margin:0 0 18px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px;align-items:center}.catmanager strong{margin-right:6px}.gallery{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.preview{height:220px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14px;background-color:#fff;background-image:linear-gradient(45deg,#eef1f5 25%,transparent 25%),linear-gradient(-45deg,#eef1f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#eef1f5 75%),linear-gradient(-45deg,transparent 75%,#eef1f5 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.preview img{max-width:100%;max-height:100%;object-fit:contain}.meta{padding:12px;min-height:140px;border-top:1px solid var(--line)}.meta strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small,.path{display:block;color:var(--muted);margin-top:5px;font-size:11px}.path{font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.local-actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:9px}.local-actions select{min-width:0;padding:7px;border:1px solid var(--line);border-radius:8px}.delete{border:1px solid #ffd5d2;background:#fff1f0;color:#b42318;border-radius:8px;cursor:pointer}.empty{grid-column:1/-1;padding:60px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}@media(max-width:1000px){.gallery{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:16px}.gallery{grid-template-columns:repeat(2,1fr)}.dropgrid{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="side"><div class="brand">☁ AIGC 小黑云<br><small>IP 资产库</small></div><nav class="nav"><a href="./index.html">项目概览</a><a href="./works.html">视频作品</a><a class="active" href="./ip.html">IP 素材库</a><a href="./components.html">组件模板</a><a href="./charter.html">项目总纲</a></nav></aside><main class="main"><section class="hero"><h1>IP 素材库 <small style="font-size:12px;color:#1677ff">v1.6</small></h1><p>公共 PNG + 我的素材。支持 PNG/ZIP 拖拽导入、导入后重新分类、删除素材，并新增自定义类目。</p><div class="stats"><div class="stat"><b id="count">2</b><span>当前素材</span></div><div class="stat"><b id="localCount">0</b><span>我的素材</span></div><div class="stat"><b id="catCount">5</b><span>当前类目</span></div></div></section><section class="dropzone" id="dropzone"><div class="dropgrid"><div><h3>拖拽 PNG / ZIP 到这里</h3><p style="color:#667085">松手自动导入；ZIP 会递归提取其中所有 PNG。</p><div class="pick"><button class="button" id="pickPng">选择 PNG</button><button class="button secondary" id="pickZip">选择 ZIP</button><input id="pngInput" type="file" accept="image/png" multiple hidden><input id="zipInput" type="file" accept=".zip,application/zip" multiple hidden></div></div><div><label>导入默认类目</label><select id="category" class="select" style="width:100%;margin-top:6px"></select></div></div><div id="dropstatus" class="dropstatus"></div></section><div class="catmanager"><strong>类目管理</strong><input id="newCat" class="newcat" placeholder="例如：AI Logo / 模型品牌"><button class="button" id="addCat">＋ 新增类目</button></div><div class="toolbar"><div class="cats" id="cats"></div><input id="search" class="search" placeholder="搜索素材…"></div><section class="gallery" id="gallery"></section></main></div><script>const staticAssets=[{id:'host-thinking',name:'host-thinking.png',cat:'host',path:'./assets/ip/xiaohieyun-test/host-thinking.png?v=3',raw:'assets/ip/xiaohieyun-test/host-thinking.png'},{id:'host-welcome',name:'host-welcome.png',cat:'host',path:'./assets/ip/xiaohieyun-test/host-welcome.png?v=2',raw:'assets/ip/xiaohieyun-test/host-welcome.png'},{id:'ai-logo-chatgpt',name:'ai-logo-chatgpt.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-chatgpt.png',raw:'assets/ip/ai-generated/ai-logo-chatgpt.png'},{id:'ai-logo-claude',name:'ai-logo-claude.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-claude.png',raw:'assets/ip/ai-generated/ai-logo-claude.png'},{id:'ai-logo-gemini',name:'ai-logo-gemini.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-gemini.png',raw:'assets/ip/ai-generated/ai-logo-gemini.png'},{id:'ai-logo-deepseek',name:'ai-logo-deepseek.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-deepseek.png',raw:'assets/ip/ai-generated/ai-logo-deepseek.png'},{id:'ai-logo-qwen',name:'ai-logo-qwen.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-qwen.png',raw:'assets/ip/ai-generated/ai-logo-qwen.png'},{id:'ai-logo-kimi',name:'ai-logo-kimi.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-kimi.png',raw:'assets/ip/ai-generated/ai-logo-kimi.png'},{id:'ai-logo-copilot',name:'ai-logo-copilot.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-copilot.png',raw:'assets/ip/ai-generated/ai-logo-copilot.png'},{id:'ai-logo-mistral',name:'ai-logo-mistral.png',cat:'ai-logo',path:'./assets/ip/ai-generated/ai-logo-mistral.png',raw:'assets/ip/ai-generated/ai-logo-mistral.png'},{id:'ai-tool-rag',name:'ai-tool-rag.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-rag.png',raw:'assets/ip/ai-generated/ai-tool-rag.png'},{id:'ai-tool-agent',name:'ai-tool-agent.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-agent.png',raw:'assets/ip/ai-generated/ai-tool-agent.png'},{id:'ai-tool-mcp',name:'ai-tool-mcp.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-mcp.png',raw:'assets/ip/ai-generated/ai-tool-mcp.png'},{id:'ai-tool-vector-db',name:'ai-tool-vector-db.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-vector-db.png',raw:'assets/ip/ai-generated/ai-tool-vector-db.png'},{id:'ai-tool-prompt',name:'ai-tool-prompt.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-prompt.png',raw:'assets/ip/ai-generated/ai-tool-prompt.png'},{id:'ai-tool-embedding',name:'ai-tool-embedding.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-embedding.png',raw:'assets/ip/ai-generated/ai-tool-embedding.png'},{id:'ai-tool-langchain',name:'ai-tool-langchain.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-langchain.png',raw:'assets/ip/ai-generated/ai-tool-langchain.png'},{id:'ai-tool-langgraph',name:'ai-tool-langgraph.png',cat:'ai-tool',path:'./assets/ip/ai-generated/ai-tool-langgraph.png',raw:'assets/ip/ai-generated/ai-tool-langgraph.png'}];const defaults=[{id:'host',name:'角色动作'},{id:'machine',name:'机器元素'},{id:'prop',name:'道具物品'},{id:'metaphor',name:'概念图'},{id:'card',name:'卡片素材'},{id:'ai-logo',name:'AI Logo'},{id:'ai-tool',name:'AI 工具图标'}];let categories=[],localAssets=[],active='all',query='',urls=[];const $=s=>document.querySelector(s);function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('project6-ip-local',3);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('assets'))d.createObjectStore('assets',{keyPath:'id'});if(!d.objectStoreNames.contains('categories'))d.createObjectStore('categories',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function getAll(store){const d=await openDb();return new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}async function init(){localAssets=await getAll('assets');const saved=await getAll('categories');categories=[...defaults,...saved.filter(x=>!defaults.some(d=>d.id===x.id))];renderCats();render()}function catName(id){return categories.find(x=>x.id===id)?.name||id}function slug(s){return 'custom-'+s.trim().toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-')+'-'+Date.now().toString(36)}async function addCategory(){const name=$('#newCat').value.trim();if(!name)return status('请输入类目名称','warn');const item={id:slug(name),name};const d=await openDb();await new Promise((res,rej)=>{const tx=d.transaction('categories','readwrite');tx.objectStore('categories').put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});$('#newCat').value='';await init();status('已新增类目：'+name,'ok')}function renderCats(){const cats=$('#cats');cats.innerHTML='<button class="cat '+(active==='all'?'on':'')+'" data-cat="all">全部</button><button class="cat '+(active==='local'?'on':'')+'" data-cat="local">我的素材</button>'+categories.map(c=>`<button class="cat ${active===c.id?'on':''}" data-cat="${c.id}">${c.name}</button>`).join('');cats.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{active=b.dataset.cat;renderCats();render()});$('#category').innerHTML=categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');$('#catCount').textContent=categories.length}function uid(){return 'local-'+Date.now()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}async function writeItems(items){if(!items.length)return 0;const d=await openDb(),cat=$('#category').value;await new Promise((res,rej)=>{const tx=d.transaction('assets','readwrite'),s=tx.objectStore('assets');items.forEach(x=>s.put({id:uid(),name:x.name,cat,blob:x.blob,source:x.source||'PNG',added:Date.now()}));tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});localAssets=await getAll('assets');active='local';renderCats();render();return items.length}async function processFiles(files){const a=[...files],png=a.filter(f=>f.type==='image/png'||f.name.toLowerCase().endsWith('.png')),zip=a.filter(f=>f.name.toLowerCase().endsWith('.zip'));let total=0;if(png.length)total+=await writeItems(png.map(f=>({name:f.name,blob:f,source:'PNG'})));for(const f of zip){try{const z=await JSZip.loadAsync(f),items=[];for(const e of Object.values(z.files))if(!e.dir&&e.name.toLowerCase().endsWith('.png')){const b=await e.async('blob');items.push({name:e.name.split('/').pop(),blob:new Blob([b],{type:'image/png'}),source:'ZIP · '+f.name})}total+=await writeItems(items)}catch(e){status('ZIP 读取失败：'+f.name,'err')}}status(total?'成功导入 '+total+' 张 PNG，并已显示在“我的素材”':'没有发现 PNG','ok')}async function updateCat(id,cat){const d=await openDb();await new Promise((res,rej)=>{const tx=d.transaction('assets','readwrite'),s=tx.objectStore('assets'),r=s.get(id);r.onsuccess=()=>{const x=r.result;if(x){x.cat=cat;s.put(x)}};tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});localAssets=await getAll('assets');render()}async function del(id){const d=await openDb();await new Promise((res,rej)=>{const tx=d.transaction('assets','readwrite');tx.objectStore('assets').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});localAssets=await getAll('assets');render()}function render(){urls.forEach(URL.revokeObjectURL);urls=[];const local=localAssets.map(x=>{const u=URL.createObjectURL(x.blob);urls.push(u);return {...x,local:true,path:u,raw:x.name}}),all=[...staticAssets,...local],items=all.filter(x=>(active==='all'||(active==='local'?x.local:x.cat===active))&&(x.name+' '+catName(x.cat)).toLowerCase().includes(query.toLowerCase()));$('#count').textContent=all.length;$('#localCount').textContent=localAssets.length;$('#gallery').innerHTML=items.length?items.map(x=>`<article class="card"><div class="preview"><img src="${x.path}" alt=""></div><div class="meta"><strong>${x.name}</strong><small>${catName(x.cat)}</small><div class="path">${x.local?'浏览器素材 · '+x.name:x.raw}</div>${x.local?`<div class="local-actions"><select data-id="${x.id}">${categories.map(c=>`<option value="${c.id}" ${c.id===x.cat?'selected':''}>${c.name}</option>`).join('')}</select><button class="delete" data-del="${x.id}">删除</button></div>`:''}</div></article>`).join(''):'<div class="empty">这个类目还没有素材</div>';document.querySelectorAll('.local-actions select').forEach(s=>s.onchange=()=>updateCat(s.dataset.id,s.value));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}function status(t,k='ok'){const e=$('#dropstatus');e.textContent=t;e.className='dropstatus show '+k}$('#addCat').onclick=addCategory;$('#pickPng').onclick=()=>$('#pngInput').click();$('#pickZip').onclick=()=>$('#zipInput').click();$('#pngInput').onchange=e=>processFiles(e.target.files);$('#zipInput').onchange=e=>processFiles(e.target.files);$('#search').oninput=e=>{query=e.target.value;render()};const dz=$('#dropzone');['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>processFiles(e.dataTransfer.files));init().catch(e=>{console.error(e);status('素材数据库初始化失败，请刷新页面','err')});</script></body></html>
