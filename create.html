<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project6 Create Project</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#10233f;font-family:"Noto Sans SC","Microsoft YaHei",sans-serif}.layout{min-height:100vh;padding:40px}.card{max-width:1000px;margin:auto;background:white;border:1px solid #dbe7f5;border-radius:28px;padding:36px;box-shadow:0 20px 60px rgba(30,70,120,.08)}h1{font-size:42px;margin:0 0 10px}p{color:#60738b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.item{background:#f8fbff;border:1px solid #dbe7f5;border-radius:18px;padding:20px}.item label{display:block;font-weight:800;margin-bottom:10px}.value{background:white;border-radius:12px;padding:12px;border:1px solid #dbe7f5}.generate{margin-top:30px;background:#2563eb;color:white;border:0;padding:16px 28px;border-radius:16px;font-size:16px;font-weight:800}.preview{margin-top:30px;background:#08172c;color:white;border-radius:22px;padding:25px}.flow{display:flex;gap:10px;flex-wrap:wrap}.flow span{background:#eff6ff;color:#2563eb;padding:10px 15px;border-radius:999px;font-weight:700}</style>
</head>
<body>
<div class="layout">
<div class="card">
<h1>创建 AI 视频项目</h1>
<p>Project6 将用户需求转换为 project.json、script.md、scenes.json。</p>
<div class="grid">
<div class="item"><label>视频标题</label><div class="value">什么是 RAG？</div></div>
<div class="item"><label>视频类型</label><div class="value">AI 知识讲解</div></div>
<div class="item"><label>视觉主题</label><div class="value">科技蓝 · Garden Style</div></div>
<div class="item"><label>声音</label><div class="value">ETG1 · Project5 TTS</div></div>
<div class="item"><label>时长</label><div class="value">180 秒</div></div>
<div class="item"><label>引擎</label><div class="value">Garden Video Engine</div></div>
</div>
<button class="generate">生成项目</button>
<div class="preview">
<h3>生成流程</h3>
<div class="flow"><span>需求</span><span>Script</span><span>Storyboard</span><span>Scene JSON</span><span>TTS</span><span>Preview</span></div>
</div>
</div>
</div>
</body>
</html>
